<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Com3_2.3 - Pomiary Klimatyczne NOAA (/data)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="container">
  <h1>Pomiary Klimatyczne NOAA (/data)</h1>

  <!-- Sekcja konfiguracyjna -->
  <div class="config-grid">
    <div class="form-group">
      <label for="token-input">Token NOAA CDO</label>
      <input type="text" id="token-input" placeholder="Wklej token">
    </div>

    <div class="form-group">
      <label for="proxy-input">Adres Proxy</label>
      <input type="text" id="proxy-input" value="http://localhost:3000/api/noaa/data">
    </div>

    <div class="form-group">
      <label for="dataset-input">Dataset ID</label>
      <input type="text" id="dataset-input" value="GHCND" placeholder="np. GHCND">
    </div>

    <div class="form-group">
      <label for="location-input">Location ID</label>
      <input type="text" id="location-input" value="ZIP:28801" placeholder="np. ZIP:28801">
    </div>

    <div class="form-group">
      <label for="datatype-input">Datatype ID (opcjonalne)</label>
      <input type="text" id="datatype-input" placeholder="np. TMAX, PRCP (puste = wszystkie)">
    </div>

    <div class="form-group">
      <label for="startdate-input">Data początkowa</label>
      <input type="date" id="startdate-input" value="2010-05-01">
    </div>

    <div class="form-group">
      <label for="enddate-input">Data końcowa</label>
      <input type="date" id="enddate-input" value="2010-05-01">
    </div>

    <div class="form-group button-group">
      <button id="fetch-btn">Pobierz pomiary</button>
    </div>
  </div>

  <div id="status-box" class="status" style="display: none;"></div>

  <table id="measurements-table" style="display: none;">
    <thead>
      <tr>
        <th>Data</th>
        <th>Typ pomiaru (Datatype)</th>
        <th>Wartość</th>
        <th>Stacja</th>
        <th>Atrybuty</th>
      </tr>
    </thead>
    <tbody id="measurements-tbody"></tbody>
  </table>
</div>

<script>
  const tokenInput = document.getElementById('token-input');
  const proxyInput = document.getElementById('proxy-input');
  const datasetInput = document.getElementById('dataset-input');
  const locationInput = document.getElementById('location-input');
  const datatypeInput = document.getElementById('datatype-input');
  const startDateInput = document.getElementById('startdate-input');
  const endDateInput = document.getElementById('enddate-input');

  const fetchBtn = document.getElementById('fetch-btn');
  const statusBox = document.getElementById('status-box');
  const table = document.getElementById('measurements-table');
  const tbody = document.getElementById('measurements-tbody');

  function setStatus(type, message) {
    if (!type) {
      statusBox.style.display = 'none';
      statusBox.className = 'status';
      return;
    }
    statusBox.className = `status ${type}`;
    statusBox.textContent = message;
    statusBox.style.display = 'block';
  }

  fetchBtn.addEventListener('click', async () => {
    const token = tokenInput.value.trim();
    const proxyUrl = proxyInput.value.trim();
    const datasetid = datasetInput.value.trim();
    const locationid = locationInput.value.trim();
    const datatypeid = datatypeInput.value.trim();
    const startdate = startDateInput.value;
    const enddate = endDateInput.value;

    if (!token) {
      setStatus('error', 'Wprowadź wymagany token NOAA CDO.');
      return;
    }

    if (!datasetid || !startdate || !enddate) {
      setStatus('error', 'Pola Dataset ID, Data początkowa oraz Data końcowa są wymagane.');
      return;
    }

    // Budowanie parametrów zapytania
    const params = new URLSearchParams({
      datasetid: datasetid,
      startdate: startdate,
      enddate: enddate,
      limit: 100
    });

    if (locationid) {
      params.append('locationid', locationid);
    }
    if (datatypeid) {
      params.append('datatypeid', datatypeid);
    }

    const requestUrl = `${proxyUrl}?${params.toString()}`;

    setStatus('loading', 'Wysyłanie zapytania i pobieranie danych pomiarowych...');
    tbody.innerHTML = '';
    table.style.display = 'none';

    try {
      const response = await fetch(requestUrl, {
        method: 'GET',
        headers: {
          'token': token
        }
      });

      if (response.status === 401) {
        throw new Error('401 Unauthorized: Błędny lub nieaktywny token NOAA.');
      }

      if (!response.ok) {
        throw new Error(`Błąd HTTP ${response.status}: ${response.statusText}`);
      }

      const data = await response.json();
      const results = data.results;

      if (!Array.isArray(results) || results.length === 0) {
        setStatus('empty', 'Brak wyników pomiarowych dla podanych kryteriów filtrowania.');
        return;
      }

      setStatus(null);
      table.style.display = 'table';

      results.forEach(item => {
        const row = document.createElement('tr');

        // Sformatowanie daty (usunięcie części godzinowej jeśli występuje)
        const dateCell = document.createElement('td');
        dateCell.textContent = item.date ? item.date.split('T')[0] : 'N/A';

        const typeCell = document.createElement('td');
        typeCell.textContent = item.datatype || 'N/A';

        const valCell = document.createElement('td');
        valCell.textContent = item.value !== undefined ? item.value : 'N/A';

        const stationCell = document.createElement('td');
        stationCell.textContent = item.station || 'N/A';

        const attrCell = document.createElement('td');
        attrCell.textContent = item.attributes || '-';

        row.append(dateCell, typeCell, valCell, stationCell, attrCell);
        tbody.appendChild(row);
      });

    } catch (err) {
      setStatus('error', `Błąd: ${err.message}. Sprawdź poprawność parametrów lub stan serwera.`);
    }
  });
</script>
</body>
</html>
