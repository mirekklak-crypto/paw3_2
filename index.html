<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Com3_2.2 - Zestawy Danych NOAA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="container">
    <h1>Zestawy Danych Klimatycznych (Datasets)</h1>
    <div class="config-grid">
        <input type="text" id="token-input" placeholder="Wklej Token NOAA" value="">
        <input type="text" id="proxy-input" placeholder="Adres Proxy" value="http://localhost:3000/api/noaa/">
        <button id="fetch-btn">Pobierz zestawy danych</button>
    </div>

    <div id="status-box" class="status" style="display: none;"></div>

    <table id="datasets-table" style="display: none;">
      <thead>
        <tr>
          <th>ID Zestawu</th>
          <th>Nazwa</th>
          <th>Od</th>
          <th>Do</th>
          <th>Pokrycie (Coverage)</th>
        </tr>
      </thead>
      <tbody id="datasets-tbody"></tbody>
    </table>
</div>

<script>
    const tokenInput = document.getElementById('token-input');
    const proxyInput = document.getElementById('proxy-input');
    const fetchBtn = document.getElementById('fetch-btn');
    const statusBox = document.getElementById('status-box');
    const table = document.getElementById('datasets-table');
    const tbody = document.getElementById('datasets-tbody');

    function setStatus(type, message) {
      if (!type) {
        statusBox.style.display = 'none';
        statusBox.className = 'status';
        return;
      }
      statusBox.className = `status ${type}`;
      statusBox.textContent = message;
      statusBox.style.display = 'block';
    }

    fetchBtn.addEventListener('click', async () => {
      const token = tokenInput.value.trim();
      let baseUrl = proxyInput.value.trim();

      if (!token) {
        setStatus('error', 'Wprowadź wymagany token NOAA CDO.');
        return;
      }

      if (!baseUrl.endsWith('/')) {
        baseUrl += '/';
      }

      const requestUrl = `${baseUrl}datasets?limit=50`;
      setStatus('loading', 'Pobieranie zestawów danych z NOAA...');
      tbody.innerHTML = '';
      table.style.display = 'none';

      try {
        const response = await fetch(requestUrl, {
          method: 'GET',
          headers: {
            'token': token
          }
        });

        if (response.status === 401) {
          throw new Error('401 Unauthorized: Błędny lub nieaktywny token NOAA.');
        }

        if (!response.ok) {
          throw new Error(`Błąd HTTP ${response.status}: ${response.statusText}`);
        }

        const data = await response.json();
        const datasets = data.results;

        if (!Array.isArray(datasets) || datasets.length === 0) {
          setStatus('empty', 'Brak zestawów danych w zwróconej odpowiedzi.');
          return;
        }

        setStatus(null);
        table.style.display = 'table';

        datasets.forEach(ds => {
          const row = document.createElement('tr');

          const idCell = document.createElement('td');
          idCell.textContent = ds.id || 'Brak ID';

          const nameCell = document.createElement('td');
          nameCell.textContent = ds.name || 'Brak nazwy';

          const minDateCell = document.createElement('td');
          minDateCell.textContent = ds.mindate || 'N/A';

          const maxDateCell = document.createElement('td');
          maxDateCell.textContent = ds.maxdate || 'N/A';

          const coverageCell = document.createElement('td');
          coverageCell.textContent = ds.datacoverage !== undefined ? `${(ds.datacoverage * 100).toFixed(0)}%` : 'N/A';

          row.append(idCell, nameCell, minDateCell, maxDateCell, coverageCell);
          tbody.appendChild(row);
        });

      } catch (err) {
        setStatus('error', `Błąd: ${err.message}. Upewnij się, że Express proxy działa.`);
      }
    });
</script>
</body>
</html>
